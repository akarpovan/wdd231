<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Image Explorer Favorites Page</title>
    <meta name="description"
        content="Anna Karpova's NASA Image Explorer favorites page for the project of BYU-Idaho WDD 231 - Web Frontend Development I course that explores stunning space imagery from NASA's archives.">
    <meta name="author" content="Anna Karpova de Nuñez">

    <!-- Social Media Meta Tags - Facebook Open Graph -->
    <meta property="og:title" content="WDD 231 - Web Frontend Development I | Anna Karpova">
    <meta property="og:description"
        content="Course work for WDD 231 - Web Frontend Development I. Explore stunning space imagery from NASA's archives">
    <meta property="og:image" content="https://akarpovan.github.io/wdd231/chamber/images/capitan-moroni.png">
    <meta property="og:url" content="https://akarpovan.github.io/wdd231/finalproject">

    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/larger.css">

    <link rel="icon" href="images/favicon.ico">

    <script src="scripts/date.js" defer></script>
    <script src="scripts/menu.js" defer></script>
    <script src="scripts/modal.js" defer></script>
    <script src="scripts/favorites.js" type="module"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>
    <header class="site-header">
        <div class="container">
            <div class="logo">
                <img src="images/nasa-logo.svg" alt="NASA Logo" width="120" height="60" class="logo-nasa">
                <span class="site-title">NASA Image Explorer</span>
            </div>
            <nav class="nav">
                <button class="menu-toggle">☰</button>
                <ul class="navigation">
                    <li><a href="index.html" id="explorer-home">Home</a></li>
                    <li><a href="gallery.html" id="explorer-gallery">Gallery</a></li>
                    <li><a href="favorites.html" id="explorer-favorites">Favorites</a></li>
                    <li><a href="contact.html" id="explorer-contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <h2>My Favorite Space Images</h2>

            <!-- Message -->
            <div class="empty-message" id="empty-message">
                <p>You haven't saved any favorite images yet.</p>
                <p>Visit the <a href="gallery.html">Gallery</a> or <a href="index.html">Home</a> to start collecting!
                </p>
            </div>

            <!-- Favorites Images -->
            <div id="favorites-container" class="favorites-grid">
                <!-- Load images with JavaScript -->
            </div>

            <!-- Single Modal for all images -->
            <dialog id="imagesModal" class="modal">
                <div class="modal-content">
                    <button class="close-modal" id="closeModal">×</button>
                    <h2 id="modalTitle">Space Image Details</h2>
                    <div id="modalBody">
                        <!-- Content will be loaded by JavaScript -->
                    </div>
                </div>
            </dialog>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>©<span id="currentyear"></span> NASA Image Explorer | 🇵🇪 🌄 🍲 Anna Karpova de Nuñez 🍲 🌄 🇵🇪 Lima,
                Perú</p>
            <p><a href="#">Project Video</a></p>
            <p id="lastModified"></p>
        </div>
    </footer>
</body>

</html>
